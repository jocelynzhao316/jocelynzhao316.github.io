<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The portfolio of Jocelyn Zhao, a student engineer and researcher." />
    <title>Jocelyn Zhao | Student Engineer & Researcher</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="content.js" defer></script>
  </head>
  <body>
    <nav class="nav" aria-label="Main navigation">
      <a class="wordmark" href="#top" aria-label="Jocelyn Zhao, home">JZ</a>
      <div class="nav-links">
        <a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a>
      </div>
    </nav>

    <header class="hero" id="top">
      <p class="eyebrow" id="roles"></p>
      <h1><span id="name"></span><span class="period">.</span></h1>
      <p class="hero-statement" id="introduction"></p>
      <a class="text-link" href="#work">View selected work <span aria-hidden="true">↓</span></a>
    </header>

    <main>
      <section class="section" id="work">
        <div class="section-heading"><p class="section-number">01</p><h2>Selected work</h2></div>
        <div class="project-list" id="project-list"></div>
      </section>

      <section class="section" id="about">
        <div class="section-heading"><p class="section-number">02</p><h2>About</h2></div>
        <div class="about-grid">
          <p class="about-lead" id="about-lead"></p>
          <div class="about-copy" id="about-copy"></div>
        </div>
      </section>
    </main>

    <footer class="footer" id="contact">
      <p class="section-number">03</p>
      <div>
        <h2>Let&rsquo;s connect.</h2>
        <p id="contact-intro"></p>
        <div class="contact-links">
          <a id="email-link">Email</a><a id="github-link" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </div>
      <p class="copyright" id="copyright"></p>
    </footer>
  </body>
</html>
